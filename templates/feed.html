{% if announcements.pages %}
<ul class="feed">
  {% for announcement in announcements.pages %}
  <li>
    <a class="feed-entry" href="{{ announcement.permalink | safe }}">
      <time datetime="{{ announcement.date }}">{{ announcement.date | date(format="%B %-d, %Y") }}</time>
      <span class="feed-title">{{ announcement.title }}</span>
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h15m-5-5 5 5-5 5"/></svg>
    </a>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="empty">No announcements yet.</p>
{% endif %}

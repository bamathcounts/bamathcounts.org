{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ config.title }}{% endblock title %}
{% block content %}
<a class="back" href="{{ get_url(path='', trailing_slash=true) | safe }}">← Home</a>
<article class="post">
  <time class="post-date" datetime="{{ page.date }}">{{ page.date | date(format="%B %-d, %Y") }}</time>
  <div class="post-content prose">
    <h1>{{ page.title }}</h1>
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}

{% extends "base.html" %}
{% block content %}
<div class="prose">{{ section.content | safe }}</div>
{% set feed = get_section(path="announcements/_index.md") %}
<h2 class="feed-heading">Announcements</h2>
<ul class="feed">
  {%- for post in feed.pages %}
  <li>
    <time datetime="{{ post.date }}">{{ post.date | date(format="%b %-d, %Y") }}</time>
    <a href="{{ post.permalink | safe }}">{{ post.title }}</a>
  </li>
  {%- endfor %}
</ul>
{% endblock content %}
